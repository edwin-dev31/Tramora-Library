<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('library-theme');
          const isDark =
            storedTheme === 'dark' ||
            (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch {
          document.documentElement.classList.toggle(
            'dark',
            matchMedia('(prefers-color-scheme: dark)').matches,
          );
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
